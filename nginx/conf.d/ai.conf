# ai.cancerwith.kr — 상담 AI
#   앱: 192.168.219.128:8100 (다른 호스트, 같은 LAN)
server {
    listen 80;
    server_name ai.cancerwith.kr;

    # ACME challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ai.cancerwith.kr;

    # 전용 인증서 — certbot 컨테이너(webroot)로 발급, ssl/data.cancerwith.kr-le 에 보관
    #   (scripts/renew-data-cert.sh 가 data 인증서와 함께 갱신합니다)
    ssl_certificate /etc/nginx/ssl/data.cancerwith.kr-le/live/ai.cancerwith.kr/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/data.cancerwith.kr-le/live/ai.cancerwith.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://192.168.219.128:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 상담 AI 응답이 30초 이상 걸릴 수 있다
        proxy_read_timeout 300s;
    }
}
