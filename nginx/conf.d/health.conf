# health.cancerwith.kr — factory (건강기능식품 OEM/ODM)
#   앱: factory-app 컨테이너 (~/바탕화면/factory/docker-compose.yml)
upstream factory_app {
    server factory-app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name health.cancerwith.kr;

    # ACME challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name health.cancerwith.kr;

    # cancerwith.kr 인증서에 health 가 SAN 으로 포함되어 있습니다.
    ssl_certificate /etc/nginx/ssl/cancerwith.kr/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/cancerwith.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # X-Frame-Options / X-Content-Type-Options / Referrer-Policy 는
    # Next.js(next.config.ts)가 이미 붙입니다. 여기서 또 붙이면 중복됩니다.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 50M;

    location / {
        proxy_pass http://factory_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
