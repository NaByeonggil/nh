upstream nextjs {
    server nh_app:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name cancerwith.kr www.cancerwith.kr localhost;

    # ACME challenge (certbot renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Configuration
server {
    listen 443 ssl;
    http2 on;
    server_name cancerwith.kr www.cancerwith.kr;

    ssl_certificate /etc/nginx/ssl/cancerwith.kr/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/cancerwith.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers (add_header 를 쓰는 location 에서도 반드시 다시 include 할 것)
    include /etc/nginx/conf.d/security-headers.inc;

    client_max_body_size 50M;

    location / {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /_next/static {
        proxy_cache STATIC;
        proxy_pass http://nextjs;
        proxy_cache_valid 60m;
        # Cache-Control 은 Next.js 업스트림이 동일한 값으로 이미 내려준다.
        # 여기서 또 add_header 하면 응답에 Cache-Control 이 두 줄 나간다.
        include /etc/nginx/conf.d/security-headers.inc;
    }

    location /uploads {
        alias /usr/share/nginx/html/uploads;
        include /etc/nginx/conf.d/security-headers.inc;
        # expires 와 add_header Cache-Control 을 같이 쓰면 Cache-Control 이 두 줄 나간다.
        # max-age 까지 add_header 하나로 합친다.
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    # 구버전 호환: 과거 히어로 이미지가 /api/images 로 우회 서빙되었다.
    # 앱에서는 제거했으나, 캐시된 HTML/북마크를 위해 nginx가 정적 파일로 직접 응답한다.
    # (prefix location 은 최장 일치가 우선하므로 아래 /api 프록시보다 먼저 매칭된다)
    location /api/images/ {
        alias /usr/share/nginx/html/uploads/;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    location /api {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC:10m inactive=7d use_temp_path=off;
