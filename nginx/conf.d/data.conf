# data.cancerwith.kr — datahealth (견적 시스템)
#   앱: datahealth-app 컨테이너 (~/바탕화면/datahealth/docker-compose.yml)
server {
    listen 80;
    server_name data.cancerwith.kr;

    # ACME challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name data.cancerwith.kr;

    # 전용 인증서 — certbot 컨테이너(webroot)로 발급, ssl/data.cancerwith.kr-le 에 보관
    ssl_certificate /etc/nginx/ssl/data.cancerwith.kr-le/live/data.cancerwith.kr/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/data.cancerwith.kr-le/live/data.cancerwith.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    client_max_body_size 50M;

    # 앱 컨테이너가 내려가 있어도 nginx 기동이 막히지 않도록 요청 시점에 이름을 푼다
    resolver 127.0.0.11 valid=30s;
    set $datahealth_app http://datahealth-app:3000;

    location / {
        proxy_pass $datahealth_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
