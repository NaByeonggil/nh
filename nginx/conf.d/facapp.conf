# facapp.cancerwith.kr — FactoryQuote
#   192.168.219.129 nh_nginx 컨테이너용: ~/바탕화면/nh/nginx/conf.d/facapp.conf
#   앱: 192.168.219.128:8110 (quote-app의 Caddy, .129 요청만 허용) → 127.0.0.1:3010 facapp 컨테이너
server {
    listen 80;
    server_name facapp.cancerwith.kr;

    # ACME challenge (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name facapp.cancerwith.kr;

    # 전용 인증서 — certbot 컨테이너(webroot)로 발급, ssl/data.cancerwith.kr-le 에 보관
    #   (scripts/renew-data-cert.sh 가 다른 인증서와 함께 갱신합니다)
    ssl_certificate /etc/nginx/ssl/data.cancerwith.kr-le/live/facapp.cancerwith.kr/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/data.cancerwith.kr-le/live/facapp.cancerwith.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 관리자 화면에는 아직 로그인이 없다. 로그인을 붙이기 전까지 LAN에서만 연다.
    location /admin {
        allow 192.168.219.0/24;
        deny all;
        proxy_pass http://192.168.219.128:8110;
    }

    location / {
        proxy_pass http://192.168.219.128:8110;
    }
}
