services:
  db:
    image: mariadb:11.4
    container_name: nh_database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nh_production}
      MYSQL_USER: ${MYSQL_USER:-nh_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./backup:/backup
    # 앱은 compose 내부 네트워크로 db:3306 에 붙는다 (DATABASE_URL 참조).
    # 이 게시 포트는 호스트 도구(db:studio, scripts)만 쓰므로 루프백으로 제한한다.
    # 예전 "3307:3306" 은 0.0.0.0 바인딩이라 LAN 어디서나 접속이 가능했고,
    # Docker 는 ufw 의 INPUT 규칙을 우회하므로 방화벽으로는 막히지 않았다.
    ports:
      - "127.0.0.1:3307:3306"
    networks:
      - nh_network
    healthcheck:
      test: ["CMD", "mariadb", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}", "-e", "SELECT 1"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nh_app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}?connection_limit=10&pool_timeout=30"
      NEXTAUTH_URL: https://cancerwith.kr
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?NEXTAUTH_SECRET must be set in .env}
      NEXT_PUBLIC_TOSS_CLIENT_KEY: test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq
      TOSS_SECRET_KEY: test_sk_zXLkKEypNArWmo50nX3lmeaxYG5R
    volumes:
      - ./public/uploads:/app/public/uploads
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nh_network

  nginx:
    image: nginx:alpine
    container_name: nh_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot:/var/www/certbot:ro
      - ./public/uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - app
    networks:
      - nh_network

volumes:
  mariadb_data:
    driver: local

networks:
  nh_network:
    driver: bridge
